name: Test
on:
  pull_request:
    branches:
      - main
  merge_group:
permissions: {}
jobs:
  test:
    name: ${{ matrix.race && 'test (race)' || 'test (no race)' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        race: [true, false]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: go build ./...
      - run: go vet ./...
      - name: Run Go tests
        uses: robherley/go-test-action@2f859e0c8769d755d3174eecb9af8f64660827f3 # v1.1.0
        with:
          testArguments: ${{ matrix.race && './... -race' || './...' }}
  test-macos:
    name: ${{ matrix.race && 'test-macos (race)' || 'test-macos (no race)' }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        race: [true, false]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify Seatbelt availability
        run: /usr/bin/sandbox-exec -p '(version 1)(allow default)' /usr/bin/true
      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.44.1
      - name: Run Go tests
        run: task ${{ matrix.race && 'test' || 'test:norace' }}
  ci:
    if: always()
    needs: [test, test-macos]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
