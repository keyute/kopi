name: Test
on:
  pull_request:
    branches:
      - main
permissions: {}
jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.race && 'race' || 'no race' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        race: [true, false]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: go build ./...
      - run: go vet ./...
      - name: Verify Seatbelt availability
        if: runner.os == 'macOS'
        run: /usr/bin/sandbox-exec -p '(version 1)(allow default)' /usr/bin/true
      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Verify bubblewrap availability
        if: runner.os == 'Linux'
        run: bwrap --die-with-parent --unshare-user --unshare-pid --cap-drop ALL --unshare-net --ro-bind / / --perms 555 --tmpfs /sys --remount-ro /sys --dev /dev --proc /proc -- true
      - name: Run Go tests
        env:
          KOPI_TEST_REQUIRE_LINUX_SANDBOX: ${{ runner.os == 'Linux' && '1' || '' }}
        uses: robherley/go-test-action@2f859e0c8769d755d3174eecb9af8f64660827f3 # v1.1.0
        with:
          testArguments: ${{ matrix.race && './... -race' || './...' }}
  ci:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
  dependabot-automerge:
    needs: ci
    # !cancelled() plus the explicit result: without a status function the job is skipped
    # whenever any job upstream of ci was skipped.
    # Actor and PR author: only Dependabot's own pushes, never someone else's commit on its
    # branch; decide() checks the actor and action again.
    if: ${{ !cancelled() && needs.ci.result == 'success' && github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]' }} # zizmor: ignore[bot-conditions]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # The job must never check out or execute the PR's code.
    # There is no merge queue on a user-owned repo, so this merges directly after ci.
    # A GITHUB_TOKEN merge triggers no push runs, which is fine: no workflow here runs on push to main.
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        # Fails (rather than emitting no updates) when the PR's first commit is not Dependabot's
        # or nothing parses; the empty outputs then send the PR down the manual path.
        continue-on-error: true
      - name: Merge or flag for review
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GROUP: ${{ steps.metadata.outputs.dependency-group }}
          UPDATES: ${{ steps.metadata.outputs.updated-dependencies-json }}
          ACTOR: ${{ github.actor }}
          EVENT_ACTION: ${{ github.event.action }}
        with:
          script: |
            // Returns why the PR needs a human, or null when it may merge. Fails closed.
            function decide(group, updates, actor, action) {
              const tail = (v) => (v || '').replace(/^v?\d+(\.\d+)*/, '');
              // Commit author fields are forgeable, so the trustworthy signal is that Dependabot
              // itself pushed the payload head SHA. github.actor is the pusher and survives re-runs.
              if ((action !== 'opened' && action !== 'synchronize') || actor !== 'dependabot[bot]') {
                return `triggered by ${actor} (${action}), not a Dependabot push`;
              }
              if (group !== 'auto' && group !== 'security') return `group "${group || 'none'}" is not auto-merged`;
              if (updates.length === 0) return 'no Dependabot metadata';
              for (const u of updates) {
                const type = u.updateType;
                let why = null;
                if (type !== 'version-update:semver-minor' && type !== 'version-update:semver-patch') {
                  if (!type) why = 'unclassified update';
                  else if (type === 'version-update:semver-major') why = 'major update';
                  else why = `unsupported update type ${type}`;
                } else if (group === 'security' && type !== 'version-update:semver-patch') why = 'security update above patch level';
                // Only the numeric part may move: what follows it is an image variant, rebuild counter,
                // pre-release label or pseudo-version hash, and a change there is a different artifact,
                // not a newer release. prevVersion can be empty.
                else if (!/^v?\d/.test(u.newVersion || '') || tail(u.prevVersion) !== tail(u.newVersion)) why = 'version format changed';
                if (why) return `${u.dependencyName} ${u.prevVersion} -> ${u.newVersion}: ${why}`;
              }
              return null;
            }

            const pr = context.payload.pull_request;
            // Everything is pinned to the SHA Dependabot pushed; a later push starts a newer run,
            // which owns the PR from then on.
            const head = pr.head.sha;
            const isCurrent = async () => {
              const { data } = await github.rest.pulls.get({ ...context.repo, pull_number: pr.number });
              return data.state === 'open' && data.head.sha === head;
            };
            let reason = decide(process.env.GROUP, JSON.parse(process.env.UPDATES || '[]'), process.env.ACTOR, process.env.EVENT_ACTION);

            if (reason === null) {
              if (!(await isCurrent())) return core.notice('Head moved or PR closed; nothing to do');
              try {
                await github.rest.pulls.merge({ ...context.repo, pull_number: pr.number, merge_method: 'squash', sha: head });
              } catch (e) {
                reason = `merge of ${head} failed: ${e.message}`;
              }
              if (reason === null) {
                // GitHub's "Automatically delete head branches" skips merges made with GITHUB_TOKEN.
                await github.rest.git.deleteRef({ ...context.repo, ref: `heads/${pr.head.ref}` });
                return core.notice(`${head} merged`);
              }
            }

            core.notice(`Manual review needed: ${reason}`);
