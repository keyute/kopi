version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Singapore
    cooldown:
      default-days: 7
    groups:
      auto:
        patterns:
          - "*"
        # PiG is pre-1.0, so minor bumps can break
        exclude-patterns:
          - "github.com/MichaelKinsy/PiG*"
        update-types:
          - minor
          - patch
      review:
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
  # Workflow actions are pinned to commit SHAs; this is what keeps them current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Singapore
    cooldown:
      default-days: 7
    groups:
      auto:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      review:
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
