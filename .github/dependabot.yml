version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Singapore
    cooldown:
      default-days: 7
    # Group names are a contract with the dependabot-automerge job in test.yml: "auto" and
    # patch-level "security" PRs merge on green ci, "review" waits for a maintainer.
    groups:
      auto:
        patterns:
          - "*"
        # PiG is pre-1.0, so minor bumps can break
        exclude-patterns:
          - "github.com/MichaelKinsy/PiG*"
        update-types:
          - minor
          - patch
      review:
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
  # Workflow actions are pinned to commit SHAs; this is what keeps them current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Singapore
    cooldown:
      default-days: 7
    groups:
      auto:
        patterns:
          - "*"
        # lint.yml skips Dependabot PRs, so CI never exercises a MegaLinter bump (auto and security).
        # The same holds for the actions only release.yml uses: it is not part of ci, and actions/attest never runs on a PR.
        exclude-patterns:
          - "oxsecurity/megalinter*"
          - "actions/attest"
          - "actions/upload-artifact"
          - "actions/download-artifact"
          - "Homebrew/actions*"
        update-types:
          - minor
          - patch
      review:
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
        exclude-patterns:
          - "oxsecurity/megalinter*"
          - "actions/attest"
          - "actions/upload-artifact"
          - "actions/download-artifact"
          - "Homebrew/actions*"
